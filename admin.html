<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist Admin - Samarth's AI Voice Agent</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #2d3748;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card i {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .stat-card .pending i { color: #f6ad55; }
        .stat-card .approved i { color: #68d391; }
        .stat-card .rejected i { color: #fc8181; }
        .stat-card .total i { color: #63b3ed; }

        .stat-card h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: #4a5568;
            font-weight: 500;
        }

        .waitlist-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: between;
            align-items: center;
        }

        .table-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .filter-controls {
            display: flex;
            gap: 1rem;
            margin: 1rem 1.5rem;
            flex-wrap: wrap;
        }

        .filter-controls select,
        .filter-controls input {
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .applications-table {
            width: 100%;
            border-collapse: collapse;
        }

        .applications-table th,
        .applications-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .applications-table th {
            background: #f7fafc;
            font-weight: 600;
            color: #2d3748;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fed7aa;
            color: #c05621;
        }

        .status-approved {
            background: #c6f6d5;
            color: #276749;
        }

        .status-rejected {
            background: #fed7d7;
            color: #c53030;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .approve-btn {
            background: #48bb78;
            color: white;
        }

        .approve-btn:hover {
            background: #38a169;
        }

        .reject-btn {
            background: #f56565;
            color: white;
        }

        .reject-btn:hover {
            background: #e53e3e;
        }

        .view-btn {
            background: #4299e1;
            color: white;
        }

        .view-btn:hover {
            background: #3182ce;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #4a5568;
        }

        .detail-group {
            margin-bottom: 1.5rem;
        }

        .detail-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .detail-group p {
            color: #4a5568;
            line-height: 1.6;
        }

        .login-form {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #2d3748;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .applications-table {
                font-size: 0.8rem;
            }

            .applications-table th,
            .applications-table td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="loginSection" class="login-form">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="adminPassword">Password:</label>
                <input type="password" id="adminPassword" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div id="loginError" style="color: red; text-align: center; margin-top: 1rem; display: none;"></div>
    </div>

    <div id="adminSection" style="display: none;">
        <div class="admin-container">
            <div class="admin-header">
                <h1><i class="fas fa-users-cog"></i> Waitlist Management</h1>
                <p>Manage user applications for the AI Voice Agent</p>
            </div>

            <div class="admin-stats">
                <div class="stat-card pending">
                    <i class="fas fa-clock"></i>
                    <h3 id="pendingCount">0</h3>
                    <p>Pending</p>
                </div>
                <div class="stat-card approved">
                    <i class="fas fa-check-circle"></i>
                    <h3 id="approvedCount">0</h3>
                    <p>Approved</p>
                </div>
                <div class="stat-card rejected">
                    <i class="fas fa-times-circle"></i>
                    <h3 id="rejectedCount">0</h3>
                    <p>Rejected</p>
                </div>
                <div class="stat-card total">
                    <i class="fas fa-list"></i>
                    <h3 id="totalCount">0</h3>
                    <p>Total Applications</p>
                </div>
            </div>

            <div class="waitlist-table">
                <div class="table-header">
                    <h2>Applications</h2>
                </div>

                <div class="filter-controls">
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <input type="text" id="searchFilter" placeholder="Search by name or email...">
                    <button onclick="refreshApplications()" class="action-btn view-btn">
                        <i class="fas fa-refresh"></i> Refresh
                    </button>
                </div>

                <table class="applications-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Use Case</th>
                            <th>Status</th>
                            <th>Applied</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTableBody">
                        <!-- Applications will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Application Detail Modal -->
        <div id="applicationModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Application Details</h3>
                    <button class="close-modal" onclick="closeModal()">&times;</button>
                </div>
                <div id="applicationDetails">
                    <!-- Details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentApplications = [];
        let authToken = localStorage.getItem('adminToken');

        // Check if already logged in
        if (authToken) {
            showAdminSection();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('adminPassword').value;
            const loginError = document.getElementById('loginError');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (response.ok) {
                    authToken = result.token;
                    localStorage.setItem('adminToken', authToken);
                    showAdminSection();
                } else {
                    loginError.textContent = result.error || 'Invalid password';
                    loginError.style.display = 'block';
                }
            } catch (error) {
                loginError.textContent = 'Connection error';
                loginError.style.display = 'block';
            }
        });

        function showAdminSection() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            loadApplications();
        }

        async function loadApplications() {
            try {
                const response = await fetch('/api/admin/applications', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    currentApplications = await response.json();
                    renderApplications(currentApplications);
                    updateStats(currentApplications);
                } else {
                    console.error('Failed to load applications');
                }
            } catch (error) {
                console.error('Error loading applications:', error);
            }
        }

        function renderApplications(applications) {
            const tbody = document.getElementById('applicationsTableBody');
            tbody.innerHTML = '';

            applications.forEach(app => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${app.fullName}</td>
                    <td>${app.email}</td>
                    <td>${app.useCase}</td>
                    <td><span class="status-badge status-${app.status}">${app.status}</span></td>
                    <td>${new Date(app.timestamp).toLocaleDateString()}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn view-btn" onclick="viewApplication('${app.id}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${app.status === 'pending' ? `
                                <button class="action-btn approve-btn" onclick="updateStatus('${app.id}', 'approved')">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="action-btn reject-btn" onclick="updateStatus('${app.id}', 'rejected')">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStats(applications) {
            const stats = applications.reduce((acc, app) => {
                acc[app.status] = (acc[app.status] || 0) + 1;
                return acc;
            }, {});

            document.getElementById('pendingCount').textContent = stats.pending || 0;
            document.getElementById('approvedCount').textContent = stats.approved || 0;
            document.getElementById('rejectedCount').textContent = stats.rejected || 0;
            document.getElementById('totalCount').textContent = applications.length;
        }

        async function updateStatus(id, status) {
            try {
                const response = await fetch(`/api/admin/applications/${id}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    loadApplications(); // Reload to reflect changes
                } else {
                    alert('Failed to update status');
                }
            } catch (error) {
                alert('Error updating status');
            }
        }

        function viewApplication(id) {
            const app = currentApplications.find(a => a.id === id);
            if (!app) return;

            const modal = document.getElementById('applicationModal');
            const details = document.getElementById('applicationDetails');

            details.innerHTML = `
                <div class="detail-group">
                    <label>Full Name:</label>
                    <p>${app.fullName}</p>
                </div>
                <div class="detail-group">
                    <label>Email:</label>
                    <p>${app.email}</p>
                </div>
                <div class="detail-group">
                    <label>Use Case:</label>
                    <p>${app.useCase}</p>
                </div>
                <div class="detail-group">
                    <label>Experience Level:</label>
                    <p>${app.experience || 'Not specified'}</p>
                </div>
                <div class="detail-group">
                    <label>How they heard about us:</label>
                    <p>${app.referral || 'Not specified'}</p>
                </div>
                <div class="detail-group">
                    <label>Reason for Access:</label>
                    <p>${app.reason}</p>
                </div>
                <div class="detail-group">
                    <label>Application Date:</label>
                    <p>${new Date(app.timestamp).toLocaleString()}</p>
                </div>
                <div class="detail-group">
                    <label>Status:</label>
                    <p><span class="status-badge status-${app.status}">${app.status}</span></p>
                </div>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('applicationModal').style.display = 'none';
        }

        function refreshApplications() {
            loadApplications();
        }

        // Filter functionality
        document.getElementById('statusFilter').addEventListener('change', filterApplications);
        document.getElementById('searchFilter').addEventListener('input', filterApplications);

        function filterApplications() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();

            let filtered = currentApplications;

            if (statusFilter) {
                filtered = filtered.filter(app => app.status === statusFilter);
            }

            if (searchFilter) {
                filtered = filtered.filter(app => 
                    app.fullName.toLowerCase().includes(searchFilter) || 
                    app.email.toLowerCase().includes(searchFilter)
                );
            }

            renderApplications(filtered);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('applicationModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
